name: Enya
description: Enya is a Singapore-based sustainable period-care consumer brand backed by 500 Global (500
  Southeast Asia) and Crusade Partners. Founded by Christian Teo, Enya sells certified organic cotton
  sanitary pads, liners, tampons, menstrual cups, period underwear and heating patches direct-to-consumer
  and via subscription (15/30/45/90-day cadence) across Singapore, Asia and the Middle East, through its
  enya.sg storefront, Shopee and retail partners such as DKSH. It is a consumer packaged-goods / e-commerce
  business with no public API, developer portal, or programmatic surface.
